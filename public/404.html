<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>GIFT Ministries</title>
  <script>
    // GitHub Pages SPA redirect — https://github.com/rafgraph/spa-github-pages
    // Encode the full URL path + query into a ?p= param and redirect to /
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1).join('/') +
      '/?p=/' + l.pathname.slice(1).replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
