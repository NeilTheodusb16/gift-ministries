    rel="stylesheet" />
  <!-- GitHub Pages SPA path restore (pairs with public/404.html) -->
  <script>
    (function () {
      var p = window.location.search.match(/[?&]p=\/([^&]*)/);
      if (p) {
        var q = window.location.search.match(/[?&]q=([^&]*)/);
        window.history.replaceState(
          null, null,
          '/' + p[1].replace(/~and~/g, '&') +
          (q ? '?' + q[1].replace(/~and~/g, '&') : '') +
          window.location.hash
        );
      }
    })();
  </script>
